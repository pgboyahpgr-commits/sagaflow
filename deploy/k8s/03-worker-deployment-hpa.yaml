apiVersion: apps/v1
kind: Deployment
metadata:
  name: sagaflow-worker
  namespace: sagaflow
  labels:
    app: sagaflow-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sagaflow-worker
  template:
    metadata:
      labels:
        app: sagaflow-worker
    spec:
      containers:
        - name: worker
          image: sagaflow:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
          env:
            - name: ROLE
              value: "worker"
          envFrom:
            - configMapRef:
                name: sagaflow-config
            - secretRef:
                name: sagaflow-secrets
          readinessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1500m
              memory: 1Gi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sagaflow-worker-hpa
  namespace: sagaflow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sagaflow-worker
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
