name: SagaFlow CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    name: Typecheck, Build & End-to-End Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install workspace dependencies
        run: npm ci

      - name: Strict TypeScript typecheck (all 4 workspaces)
        run: npm run typecheck

      - name: Build shared, engine, API & Vite Studio SPA
        run: npm run build

      - name: Run full Vitest suite (43 end-to-end tests)
        run: npm test

      - name: Smoke-test CLI workflow validator & 100-run benchmark
        run: |
          node apps/api/dist/cli.js benchmark --runs 100 --concurrency 25 --json /tmp/ci-bench.json

  docker:
    name: Verify Multi-Stage Production Container
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build production Docker image
        run: docker build -t sagaflow:ci .
